name: Build Geode Mod

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode
        run: git clone https://github.com/geode-sdk/geode.git $env:USERPROFILE\geode

      - name: Configure
        run: cmake -B build -DGEODE_SDK=$env:USERPROFILE\geode

      - name: Build
        run: cmake --build build --config Release
